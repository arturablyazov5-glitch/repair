<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<!-- Шрифты локальные: css/fonts.css + fonts/*.woff2 (подключается build.mjs). Предзагрузка основных кириллических файлов -->
<link rel="preload" href="{{root}}fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<!-- SEO · владелец: Афанасий. Плейсхолдеры title/description/canonicalPath/robots подставляет build.mjs (replaceAll).
     TODO: заменить домен-заглушку https://servis-lyuks.example на боевой (здесь, в robots.txt и sitemap.xml) -->
<link rel="canonical" href="https://servis-lyuks.example/{{canonicalPath}}">
<meta name="theme-color" content="#0d5c6b">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%230d5c6b'/%3E%3Cpath d='M24.5 11.5a5.5 5.5 0 0 0-6.9 6.9l-6.4 6.4a2 2 0 0 0 2.8 2.8l6.4-6.4a5.5 5.5 0 0 0 6.9-6.9l-3.2 3.2-2.5-.3-.3-2.5z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='31' cy='9' r='3.2' fill='%23f2a33a'/%3E%3C/svg%3E">
<!-- Open Graph / Twitter. TODO: og:image — временно фото фасада media/photos/photo-01.jpg; заменить на макет 1200×630 и домен на боевой -->
<meta property="og:type" content="website">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="{{cfg.name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://servis-lyuks.example/{{canonicalPath}}">
<meta property="og:image" content="https://servis-lyuks.example/media/photos/photo-01.jpg">
<meta property="og:image:width" content="960">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="Фасад сервиса {{cfg.name}}, Краснодар, ул. Березанская, 89">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="https://servis-lyuks.example/media/photos/photo-01.jpg">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": ["LocalBusiness", "HomeAndConstructionBusiness"],
  "@id": "https://servis-lyuks.example/#business",
  "name": "{{cfg.name}}",
  "description": "{{cfg.tagline}}: стиральные и посудомоечные машины, холодильники, духовые шкафы, варочные панели, вытяжки, кофемашины, встраиваемая и премиальная техника.",
  "url": "https://servis-lyuks.example/",
  "image": "https://servis-lyuks.example/media/photos/photo-01.jpg",
  "telephone": "{{cfg.phoneHref}}",
  "priceRange": "₽₽",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "ул. Березанская, 89",
    "addressLocality": "Краснодар",
    "addressRegion": "Краснодарский край",
    "addressCountry": "RU"
  },
  "geo": { "@type": "GeoCoordinates", "latitude": {{cfg.geo.lat}}, "longitude": {{cfg.geo.lon}} },
  "hasMap": "{{cfg.yandex.orgUrl}}",
  "sameAs": ["{{cfg.yandex.orgUrl}}"],
  "areaServed": { "@type": "City", "name": "Краснодар" },
  "openingHoursSpecification": [
    { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:00", "closes": "18:00" },
    { "@type": "OpeningHoursSpecification", "dayOfWeek": "Saturday", "opens": "10:00", "closes": "16:00" }
  ],
  "contactPoint": { "@type": "ContactPoint", "telephone": "{{cfg.phoneHref}}", "contactType": "customer service", "areaServed": "RU", "availableLanguage": "Russian" }
}
</script>
